spring:
  application:
    name: nivva-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/nivva}
    username: ${DB_USERNAME:nivva}
    password: ${DB_PASSWORD:nivva}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

nivva:
  jwt:
    secret-base64: ${NIVVA_JWT_SECRET_BASE64:}
    issuer: nivva-api
    ttl: 1h
